<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fridge-to-Table</title>
<style>
  :root {
    --bg: #f6f5f1; --surface: #fff; --text: #1f2421; --muted: #6b716d; --line: #e3e1da;
    --accent: #2f7d4f; --accent-soft: #e4f1e8; --warn: #b5530b; --warn-soft: #fdf0e3;
    --user: #2f7d4f; --user-text: #fff; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
           padding-top: calc(10px + env(safe-area-inset-top, 0px));
           background: var(--surface); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; flex: 1; white-space: nowrap; }
  .hbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px;
           background: var(--accent); color: #fff; font-size: 12px; text-align: center; }

  /* chat */
  #messages { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; }
  .msg.agent { display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 8px; max-width: 96%; }
  .msg.agent .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft);
                       display: grid; place-items: center; font-size: 16px; align-self: start; }
  .msg.agent .content { min-width: 0; }
  .msg.user { align-self: flex-end; }
  .msg.agent, .msg.system { align-self: flex-start; }
  .bubble { padding: 9px 12px; border-radius: var(--radius); white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
  .agent .bubble { background: var(--surface); border-top-left-radius: 4px;
                   box-shadow: 0 1px 2px rgba(31,36,33,.07), 0 2px 8px rgba(31,36,33,.04); }
  .system .bubble { background: var(--warn-soft); color: var(--warn); border: 1px solid #f2d3b3; }
  .user .photos { display: flex; gap: 4px; justify-content: flex-end; margin-bottom: 4px; flex-wrap: wrap; }
  .user .photos figure { margin: 0; position: relative; }
  .user .photos img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; display: block; }
  .user .photos figcaption { position: absolute; left: 2px; bottom: 2px; font-size: 10px; padding: 0 4px;
                             background: rgba(0,0,0,.6); color: #fff; border-radius: 4px; }

  .questions { margin: 6px 0 0; padding-left: 18px; color: var(--text); }
  .hero { text-align: center; padding: 22px 18px; background: var(--surface); border-radius: 20px;
          box-shadow: 0 1px 2px rgba(31,36,33,.07), 0 4px 16px rgba(31,36,33,.06); }
  .hero .big { width: 84px; height: 84px; margin: 0 auto 10px; border-radius: 50%; background: var(--accent-soft);
               display: grid; place-items: center; font-size: 42px; }
  .hero h2 { margin: 0 0 6px; font-size: 20px; }
  .hero p { margin: 0 auto 16px; color: var(--muted); max-width: 30em; }
  .hero .go { display: block; width: 100%; border: 0; border-radius: 24px; height: 48px; background: var(--accent);
              color: #fff; font-weight: 700; font-size: 16px; }
  .hero .alt { margin-top: 8px; border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px; }
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .card { text-align: left; background: var(--surface); border: 0; border-radius: var(--radius); padding: 12px;
          width: 100%; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: start;
          box-shadow: 0 1px 2px rgba(31,36,33,.07), 0 2px 8px rgba(31,36,33,.05); }
  .card:active { background: var(--accent-soft); }
  .card .tile { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; }
  .tile.t0 { background: #e4f1e8; } .tile.t1 { background: #fdf0e3; } .tile.t2 { background: #fdf6d8; }
  .tile.t3 { background: #e8eefb; }
  .card .title { font-weight: 650; font-size: 16px; line-height: 1.25; }
  .card .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .card .soonline { color: var(--warn); font-size: 13px; font-weight: 600; margin-top: 2px; }
  .card .buyline { font-size: 13px; margin-top: 2px; }
  .card .buyline .none { color: var(--accent); }
  .offer { margin-top: 8px; border: 1px solid #cfe3d6; background: var(--surface); color: var(--accent);
           border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; }
  .card .open { color: var(--accent); font-size: 13px; font-weight: 600; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip.soon { background: var(--warn-soft); color: var(--warn); font-weight: 600; }

  .shop { margin-top: 8px; background: var(--surface); border-radius: var(--radius); padding: 10px 12px;
          box-shadow: 0 1px 2px rgba(31,36,33,.07), 0 2px 8px rgba(31,36,33,.05); }
  .sheet .shop { box-shadow: none; border: 1px solid var(--line); }
  .shop h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; color: var(--muted); }
  .shop h3:first-child { margin-top: 0; }
  .shop ul { margin: 0; padding-left: 18px; }
  .shop .check { color: var(--muted); }
  .shop .empty { color: var(--accent); }

  details.trace { margin-top: 6px; font-size: 12px; color: var(--muted); }
  details.trace summary { cursor: pointer; list-style: none; }
  details.trace summary::before { content: "▸ "; }
  details.trace[open] summary::before { content: "▾ "; }
  details.trace ol { margin: 4px 0 0; padding-left: 20px; }
  details.trace li { margin: 4px 0; overflow-wrap: anywhere; }
  details.trace .step { display: block; color: var(--text); }
  details.trace .tech { display: block; font-size: 11px; font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
  details.trace .fail, details.trace .fail .step { color: var(--warn); }
  details.trace summary .fail { font-weight: 600; }

  .typing .bubble { color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); opacity: .35;
            animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* composer */
  .composer { background: var(--surface); border-top: 1px solid var(--line); padding: 8px 10px;
              padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  .pending { display: flex; gap: 6px; padding: 8px 8px 8px 0; overflow-x: auto; }  /* room for the × */
  .quick { display: flex; gap: 6px; overflow-x: auto; padding: 0 0 8px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .qchip { flex: none; white-space: nowrap; border: 1px solid #cfe3d6; background: var(--accent-soft);
           color: var(--accent); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
  .qchip:disabled { opacity: .5; }
  /* the cooking mode switch (T4.5): two halves, the chosen one filled */
  .cookmode { display: flex; background: var(--accent-soft); border-radius: 999px; padding: 3px; margin: 0 0 8px; }
  .cookmode button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 6px 8px;
                     font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; }
  .cookmode button[aria-checked="true"] { background: var(--surface); color: var(--text);
                                          box-shadow: 0 1px 3px rgba(31,36,33,.15); }
  .cookmode button:disabled { opacity: .5; }
  .thumb { position: relative; flex: none; }
  .thumb img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; display: block; }
  .thumb .tag { position: absolute; left: 3px; right: 3px; bottom: 3px; border: 0; border-radius: 6px; padding: 2px 0;
                font-size: 11px; font-weight: 600; background: rgba(255,255,255,.92); }
  .thumb .rm { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%;
               border: 0; background: var(--text); color: #fff; font-size: 13px; line-height: 22px; padding: 0; }
  .row { display: flex; gap: 6px; align-items: flex-end; }
  .iconbtn { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line);
             background: var(--surface); font-size: 19px; padding: 0; }
  #input { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 21px; padding: 10px 14px;
           font: inherit; max-height: 120px; background: var(--bg); color: var(--text); }
  #input:focus, .add input:focus, .item.editing input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #send { flex: none; height: 42px; border: 0; border-radius: 21px; padding: 0 16px; background: var(--accent);
          color: #fff; font-weight: 600; }
  #send:disabled { opacity: .5; }

  /* overlays: inventory drawer and recipe sheet */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 10; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--bg); z-index: 11;
            display: flex; flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,.15); }
  .drawer header { position: sticky; top: 0; }
  .drawer .body { overflow-y: auto; padding: 12px 14px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .loc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 12px; }
  .loc-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--line); }
  .loc-head h2 { font-size: 16px; margin: 0; }
  .loc-head .when { flex: 1; font-size: 12px; color: var(--muted); }
  .loc-head .when.no { color: var(--warn); }
  .loc-head .iconbtn { width: 34px; height: 34px; font-size: 16px; }
  .items { list-style: none; margin: 0; padding: 0; }
  .item { border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .line { display: flex; align-items: center; gap: 4px; padding-right: 6px; }
  .item .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none;
                text-align: left; padding: 10px 6px 10px 12px; }
  .item .emo { width: 26px; text-align: center; font-size: 19px; flex: none; }
  .item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .flag { font-size: 12px; font-weight: 600; flex: none; }
  .item .flag.soonflag { color: var(--warn); }
  .item .lvl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); flex: none; }
  .item .lvl i { width: 9px; height: 9px; border-radius: 50%; }
  .lvl.plenty i { background: #2f9e5b; } .lvl.some i { background: #d9a21b; } .lvl.low i { background: #c2410c; }
  .item.open { background: #fafaf7; }
  .item .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 12px 12px 48px; }
  .actions .act { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 11px;
                  font-size: 13px; }
  .actions .act.on { background: var(--warn); border-color: var(--warn); color: #fff; }
  .actions .act.danger { color: var(--warn); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  .item.uncertain { background: var(--warn-soft); }
  .item.uncertain .name::after { content: " ?"; color: var(--warn); font-weight: 700; }
  .item.notseen { background: #f0efea; }
  .item.notseen .name { color: var(--muted); font-style: italic; }
  .item.notseen .name::after { content: " · not seen"; font-size: 12px; font-style: normal; }
  .review-group .item.notseen .name::after { content: ""; }
  .review-group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
                     margin: 14px 0 4px; }
  .review-group .why { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .sheet .review-group .items { padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .sheet .foot { display: flex; gap: 8px; padding: 10px 16px 12px;
                 border-top: 1px solid var(--line); }
  .sheet .foot button { flex: 1; height: 44px; border-radius: 22px; font-weight: 600; }
  .sheet .foot .primary { border: 0; background: var(--accent); color: #fff; }
  .sheet .foot .secondary { border: 1px solid var(--line); background: var(--surface); }
  .qty { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: 12px;
         min-width: 62px; }
  .qty.low { color: var(--warn); }
  .soon { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 3px 8px; font-size: 12px;
          color: #a3a8a4; }
  .soon.on { background: var(--warn); border-color: var(--warn); color: #fff; }
  .del, .edit, .ok { border: 0; background: none; color: var(--muted); font-size: 18px; width: 28px; padding: 0; flex: none; }
  .edit { font-size: 15px; }
  .ok { color: var(--accent); font-weight: 700; }
  .item.editing { display: flex; gap: 6px; align-items: center; padding: 8px 10px 8px 12px; }
  .item.editing input { flex: 1; min-width: 0; border: 1px solid var(--accent); border-radius: 8px; padding: 5px 8px;
                        font: inherit; background: var(--surface); color: var(--text); }
  .item.editing .save { border: 0; border-radius: 8px; background: var(--accent); color: #fff; padding: 5px 10px; }
  .item.editing .cancel { border: 0; background: none; color: var(--muted); padding: 5px 4px; }
  .hint { padding: 6px 12px; font-size: 12px; color: var(--warn); background: var(--warn-soft);
          border-bottom: 1px solid var(--line); }
  .add { display: flex; gap: 6px; padding: 8px 10px; }
  .add input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font: inherit;
               background: var(--bg); color: var(--text); }
  .add button { border: 0; border-radius: 8px; background: var(--accent-soft); color: var(--accent); padding: 0 12px; }
  .empty-loc { padding: 8px 12px; color: var(--muted); font-size: 13px; }
  .shop .amount { color: var(--muted); font-size: 13px; }
  .hbtn.icon { padding: 6px 10px; }
  .sheet .chats { list-style: none; margin: 0; padding: 0; }
  .hbtn { white-space: nowrap; }
  /* Narrow phones: the four header items must fit on one line. */
  @media (max-width: 400px) {
    header { gap: 6px; }
    .hbtn { padding: 6px 9px; font-size: 14px; }
  }
  @media (max-width: 380px) {
    header h1 { font-size: 0; }
    header h1::before { content: "🍳"; font-size: 22px; }
  }
  .chats li { margin: 0; }
  .chat-row { width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none;
              padding: 12px 4px; display: block; }
  .chat-row:active { background: var(--accent-soft); }
  .chat-row .title { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-row .when { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .chat-row .here { color: var(--accent); font-weight: 600; }
  .restart { margin: 18px 0 6px; text-align: center; }
  .restart .link { border: 0; background: none; color: var(--warn); text-decoration: underline; padding: 6px; }
  .restart .confirm { background: var(--warn-soft); border: 1px solid #f2d3b3; border-radius: var(--radius);
                      padding: 12px; text-align: left; }
  .restart .confirm p { margin: 0 0 10px; }
  .restart .row2 { display: flex; gap: 8px; }
  .restart .row2 button { flex: 1; height: 40px; border-radius: 20px; font-weight: 600; }
  .restart .danger { border: 0; background: var(--warn); color: #fff; }
  .restart .keep { border: 1px solid var(--line); background: var(--surface); }
  details.staples summary { padding: 10px 12px; cursor: pointer; font-weight: 600; }

  /* A centered window (recipe, review after a scan). Only its body scrolls; the shadows at its top and
     bottom edges appear when there is more to scroll (background-attachment: local). */
  .sheet { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 11;
           width: min(560px, calc(100vw - 24px)); max-height: min(85dvh, 800px); background: var(--surface);
           border-radius: 18px; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,.25); }
  .sheet .grip { display: none; }
  .sheet .head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 16px 6px;
                 border-bottom: 1px solid var(--line); }
  .sheet .head h2 { flex: 1; margin: 0; font-size: 19px; }
  .sheet .body { overflow-y: auto; overscroll-behavior: contain; min-height: 0; padding: 4px 16px 20px;
                 background:
                   linear-gradient(var(--surface) 30%, transparent) center top,
                   linear-gradient(transparent, var(--surface) 70%) center bottom,
                   radial-gradient(farthest-side at 50% 0, rgba(0,0,0,.14), transparent) center top,
                   radial-gradient(farthest-side at 50% 100%, rgba(0,0,0,.14), transparent) center bottom;
                 background-repeat: no-repeat; background-size: 100% 40px, 100% 40px, 100% 12px, 100% 12px;
                 background-attachment: local, local, scroll, scroll; }
  .sheet .meta { color: var(--muted); margin-bottom: 8px; }
  .sheet h3 { font-size: 14px; margin: 14px 0 6px; }
  .sheet ul, .sheet ol { margin: 0; padding-left: 20px; }
  .sheet li { margin: 3px 0; }
  .sheet .have { color: var(--accent); font-size: 12px; }
  .sheet .buy { color: var(--warn); font-size: 12px; font-weight: 600; }
  .sheet .sub { color: var(--accent); font-size: 12px; font-weight: 600; }
  .sheet .shop { margin: 10px 0 4px; }
  .sheet .opt { color: var(--muted); font-size: 12px; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
             animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Fridge-to-Table</h1>
    <button class="hbtn icon" id="openHistory" type="button" title="Past chats" aria-label="Past chats">🕘</button>
    <button class="hbtn" id="newChat" type="button">New chat</button>
    <button class="hbtn" id="openInv" type="button">Inventory<span class="badge" id="invCount">0</span></button>
  </header>

  <main id="messages" aria-live="polite"></main>

  <form class="composer" id="composer">
    <div class="cookmode" id="cookMode" role="radiogroup" aria-label="Cooking mode" hidden></div>
    <div class="quick" id="quick" aria-label="Quick replies"></div>
    <div class="pending" id="pending" hidden></div>
    <div class="row">
      <button class="iconbtn" id="attach" type="button" title="Take a photo" aria-label="Take a photo">📷</button>
      <button class="iconbtn" id="gallery" type="button" title="Choose from gallery" aria-label="Choose photos from the gallery">🖼️</button>
      <!-- capture opens the camera directly on a phone; the gallery input has no capture, so it opens the photo library -->
      <input id="file" type="file" accept="image/*" multiple capture="environment" hidden>
      <input id="galleryFile" type="file" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="Ask what to cook, or say what you want to make…"></textarea>
      <button id="send" type="submit">Send</button>
    </div>
  </form>
</div>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="drawer" hidden aria-label="Inventory">
  <header>
    <h1>Inventory</h1>
    <button class="hbtn" id="closeInv" type="button">Close</button>
  </header>
  <div class="body" id="invBody"></div>
</aside>

<section class="sheet" id="review" hidden aria-label="Check the inventory">
  <div class="grip"></div>
  <div class="head"><h2 id="reviewTitle">Check what I found</h2></div>
  <div class="body" id="reviewBody"></div>
  <div class="foot">
    <button class="secondary" id="reviewLater" type="button">Later</button>
    <button class="primary" id="reviewOk" type="button">All correct</button>
  </div>
</section>

<section class="sheet" id="history" hidden aria-label="Past chats">
  <div class="head"><h2>Your chats</h2><button class="hbtn" id="closeHistory" type="button">Close</button></div>
  <div class="body" id="historyBody"></div>
</section>

<section class="sheet" id="sheet" hidden aria-label="Recipe">
  <div class="grip"></div>
  <div class="head"><h2 id="sheetTitle"></h2><button class="hbtn" id="closeSheet" type="button">Close</button></div>
  <div class="body" id="sheetBody"></div>
</section>

<script>
"use strict";
const PLACES = ["fridge", "freezer", "pantry"];
const QTY_LEVELS = ["plenty", "some", "low"];
const PLACE_LABEL = { fridge: "🧊 Fridge", freezer: "❄️ Freezer", pantry: "🥫 Pantry" };
const MAX_PHOTOS = 4;

const $ = (id) => document.getElementById(id);
const state = {
  sessionId: null,
  inventory: [],
  scanState: { scanned: {} },
  pending: [],          // [{file, url, place}]
  nextPlace: null,      // set by a panel camera button: the place for the next picked photos
  reviewPlaces: null,   // places shown in the review sheet while it is open
  openItem: null,       // the inventory item whose actions are shown (one at a time)
  busy: false,
  transcript: [],       // what is shown, so a reload of the same session shows it again
  // the cooking mode switch (T4.5): "home" = only what is there, "shop" = a few things to buy are OK
  cookMode: null,
};

// --- small helpers -------------------------------------------------------------------------------

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) node.append(c);
  return node;
}

function storageGet(key) { try { return localStorage.getItem(key); } catch { return null; } }
function storageSet(key, value) { try { localStorage.setItem(key, value); } catch { /* private mode etc. */ } }

function newSessionId() {
  return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
}

function cap(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }

function ago(iso) {
  const days = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (days <= 0) return "scanned today";
  if (days === 1) return "scanned yesterday";
  return `scanned ${days} days ago`;
}

// An emoji for an inventory item: by a word of its name first ("cheddar" -> 🧀), else by its category.
const NAME_EMOJI = [
  [/eggplant|aubergine/, "🍆"], [/\bmilk\b/, "🥛"], [/\beggs?\b/, "🥚"], [/cheese|cheddar|parmesan|mozzarella|feta|ricotta/, "🧀"], [/butter/, "🧈"],
  [/bread|baguette/, "🍞"], [/tomato|ketchup/, "🍅"], [/onion/, "🧅"], [/garlic/, "🧄"], [/carrot/, "🥕"],
  [/potato/, "🥔"], [/bell pepper/, "🫑"], [/mushroom/, "🍄"], [/lemon|lime/, "🍋"], [/apple/, "🍎"], [/banana/, "🍌"],
  [/chicken/, "🍗"], [/bacon/, "🥓"], [/beef|steak|pork|lamb/, "🥩"], [/fish|salmon|tuna|shrimp/, "🐟"],
  [/\brice\b/, "🍚"], [/pasta|spaghetti|noodle/, "🍝"], [/coffee|espresso/, "☕"], [/yogurt|cream/, "🥛"],
  [/spinach|lettuce|kale|cabbage/, "🥬"], [/zucchini|cucumber/, "🥒"], [/avocado/, "🥑"],
  [/corn/, "🌽"], [/broccoli/, "🥦"], [/honey/, "🍯"], [/oil/, "🫒"], [/salt/, "🧂"], [/sugar/, "🍬"], [/flour/, "🌾"],
  [/water/, "💧"], [/pepper|chili|paprika|cumin|oregano/, "🌶️"], [/soy sauce|vinegar/, "🍶"], [/baking/, "🧁"],
];
const CATEGORY_EMOJI = {
  vegetable: "🥬", fruit: "🍎", meat: "🥩", fish: "🐟", dairy: "🧀", egg: "🥚", grain: "🍚", pasta: "🍝",
  canned: "🥫", baking: "🧁", sauce: "🍅", condiment: "🧂", spice: "🌶️", snack: "🍪", drink: "🥤", frozen: "🧊",
};
function itemEmoji(item) {
  const name = String(item.name).toLowerCase();
  const hit = NAME_EMOJI.find(([re]) => re.test(name));
  return hit ? hit[1] : CATEGORY_EMOJI[item.category] || "🍽️";
}

// An emoji for a dish, from words of its name (the first rule that matches wins).
const DISH_EMOJI = [
  [/pancake|crepe|waffle/, "🥞"], [/pizza/, "🍕"], [/burger/, "🍔"],
  [/lasagn|pasta|spaghetti|penne|fusilli|macaroni|noodle|carbonara|bolognese/, "🍝"], [/soup|stew|broth/, "🍲"],
  [/curry/, "🍛"], [/salad/, "🥗"], [/omelet|frittata|scrambl|shakshuka|\beggs?\b/, "🍳"],
  [/stir.?fry|skillet|saut/, "🥘"], [/rice|risotto|pilaf/, "🍚"], [/quesadilla|taco|burrito|wrap/, "🌮"],
  [/sandwich|toast|panini/, "🥪"], [/bake|gratin|casserole/, "🥘"], [/chicken/, "🍗"], [/fish|salmon|tuna/, "🐟"],
  [/cake|muffin|cookie/, "🧁"],
];
function dishEmoji(name) {
  const low = String(name).toLowerCase();
  const hit = DISH_EMOJI.find(([re]) => re.test(low));
  return hit ? hit[1] : "🍽️";
}
function tileColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `t${h % 4}`;
}

function itemsByName() {
  const map = new Map();
  for (const i of state.inventory) map.set(i.name, i);
  return map;
}

function displayName(name) {
  const item = itemsByName().get(name);
  return item ? item.display_name : name;
}

async function api(path, options = {}) {
  let res;
  try {
    res = await fetch(path, options);
  } catch {
    throw new Error("Cannot reach the server. Check the connection and try again.");
  }
  let body = null;
  try { body = await res.json(); } catch { /* not JSON */ }
  if (!res.ok) {
    const detail = body && body.detail;
    throw new Error(typeof detail === "string" ? detail : `Request failed (${res.status}).`);
  }
  return body;
}

// --- session and transcript ----------------------------------------------------------------------

const MAX_CHATS = 30;

function saveTranscript() {
  storageSet("ftt.transcript." + state.sessionId, JSON.stringify(state.transcript.slice(-60)));
  indexChat(state.sessionId, state.transcript);
}

// The History index (this browser only): [{id, started, updated, title}], newest first. A chat is listed
// once the user has written or sent something in it; a greeting alone is not a chat.
function chatTitle(transcript) {
  const first = transcript.find((e) => e.role === "user");
  if (!first) return "";
  if (first.text) return first.text.length > 70 ? first.text.slice(0, 67) + "…" : first.text;
  const places = [...new Set((first.photos || []).map((p) => p.place))].join(", ");
  return `📷 ${(first.photos || []).length} photo(s)${places ? ` (${places})` : ""}`;
}

function loadChats() {
  let chats = [];
  try { chats = JSON.parse(storageGet("ftt.chats")) || []; } catch { chats = []; }
  // Chats saved before the History existed: rebuild their entries from the stored transcripts.
  try {
    const known = new Set(chats.map((c) => c.id));
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith("ftt.transcript.")) continue;
      const id = key.slice("ftt.transcript.".length);
      if (known.has(id)) continue;
      let transcript = [];
      try { transcript = JSON.parse(localStorage.getItem(key)) || []; } catch { transcript = []; }
      const title = chatTitle(transcript);
      if (title) chats.push({ id, started: null, updated: null, title });
    }
  } catch { /* storage not readable: what the index has is all we know */ }
  return chats;
}

function indexChat(id, transcript) {
  const title = chatTitle(transcript);
  if (!title) return;
  const now = new Date().toISOString();
  const chats = loadChats().filter((c) => c.id !== id);
  const old = loadChats().find((c) => c.id === id);
  chats.unshift({ id, started: (old && old.started) || now, updated: now, title });
  const keep = chats.slice(0, MAX_CHATS);
  for (const gone of chats.slice(MAX_CHATS)) {
    try { localStorage.removeItem("ftt.transcript." + gone.id); } catch { /* ignore */ }
  }
  storageSet("ftt.chats", JSON.stringify(keep));
}

function when(iso) {
  if (!iso) return "earlier";
  const d = new Date(iso);
  const time = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const days = Math.floor((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
  if (days === 0) return `Today ${time}`;
  if (days === 1) return `Yesterday ${time}`;
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ` ${time}`;
}

function openHistory() {
  const chats = loadChats().sort((a, b) => String(b.updated || "").localeCompare(String(a.updated || "")));
  $("historyBody").replaceChildren(chats.length
    ? el("ul", { class: "chats" }, chats.map((c) => el("li", {},
        el("button", { class: "chat-row", type: "button", onclick: () => openChat(c.id) },
          el("span", { class: "title" }, c.title),
          el("span", { class: "when" }, when(c.updated),
            c.id === state.sessionId ? el("span", { class: "here" }, " · this chat") : null)))))
    : el("div", { class: "empty-loc" }, "No past chats yet. They appear here once you write something."));
  showOverlay("history");
  $("historyBody").scrollTop = 0;
}

// Reopen a past chat: its messages come back, and the agent continues it (its history is on the server).
function openChat(id) {
  if (state.busy) return;
  closeOverlays();
  if (id !== state.sessionId) startSession(id);
}

function loadTranscript() {
  try { return JSON.parse(storageGet("ftt.transcript." + state.sessionId)) || []; } catch { return []; }
}

function startSession(id) {
  state.sessionId = id;
  storageSet("ftt.session", id);
  state.transcript = loadTranscript();
  $("messages").replaceChildren();
  updateHero();
  for (const entry of state.transcript) renderEntry(entry);
  scrollDown();
}

// --- rendering messages --------------------------------------------------------------------------

function scrollDown() { const m = $("messages"); m.scrollTop = m.scrollHeight; }

function addEntry(entry) {
  state.transcript.push(entry);
  saveTranscript();
  renderEntry(entry);
  scrollDown();
}

function renderEntry(entry) {
  const box = $("messages");
  if (entry.role === "user") box.append(renderUser(entry));
  else if (entry.role === "agent") box.append(renderAgent(entry.data, entry.asked));
  else box.append(el("div", { class: "msg system" }, el("div", { class: "bubble" }, entry.text)));
}

function renderUser(entry) {
  const node = el("div", { class: "msg user" });
  if (entry.photos && entry.photos.length) {
    node.append(el("div", { class: "photos" }, entry.photos.map((p) =>
      el("figure", {}, p.url ? el("img", { src: p.url, alt: "" }) : el("div", { class: "bubble" }, "📷"),
         el("figcaption", {}, cap(p.place))))));
  }
  if (entry.text) node.append(el("div", { class: "bubble" }, entry.text));
  return node;
}

function agentShell(...children) {
  return el("div", { class: "msg agent" }, el("div", { class: "avatar", "aria-hidden": "true" }, "🍳"),
    el("div", { class: "content" }, ...children));
}

// `asked` is the user's message this reply answers (for the "Shopping OK" button).
function renderAgent(data, asked) {
  const reply = data.reply;
  const shell = agentShell(el("div", { class: "bubble" }, reply.message));
  const node = shell.querySelector(".content");

  if (reply.questions && reply.questions.length) {
    node.append(el("ul", { class: "questions" }, reply.questions.map((q) => el("li", {}, q))));
  }

  const meals = reply.meals || [];
  const hasShop = (reply.shopping_list || []).length || (reply.check_first || []).length
    || (reply.substitutions || []).length;
  // Several meals with a shopping list (Shopping OK mode): each card says what it needs.
  const perCard = hasShop && meals.length > 1;
  if (meals.length) node.append(el("div", { class: "cards" }, meals.map((m) => renderCard(m, data, perCard))));

  // Mode B: a single recipe with nothing missing still gets the block, saying so.
  if (!perCard && (hasShop || (meals.length === 1 && isModeB(data)))) node.append(renderShop(reply));

  // Only what I have, and few ideas came back: one tap asks again with shopping allowed.
  if (reply.offer_shop && asked) {
    node.append(el("button", { class: "offer", type: "button", onclick: () => {
      if (state.busy) return;
      setCookMode("shop");
      $("input").value = asked;
      updateSend();
      $("composer").requestSubmit();
    } }, "🛒 Show ideas with a short shopping list"));
  }

  if (data.trace && data.trace.length) node.append(renderTrace(data.trace, data.usage));
  return shell;
}

function isModeB(data) {
  return (data.trace || []).some((t) => t.tool === "compute_missing");
}

// The reply's lists cut down to one meal's ingredients (a reply with several meals has one combined list).
function replyForMeal(reply, meal) {
  const names = new Set(meal.ingredients.map((i) => i.name.toLowerCase()));
  const mine = (xs) => (xs || []).filter((x) => names.has(String(x).toLowerCase()));
  return { ...reply, meals: [meal], shopping_list: mine(reply.shopping_list), check_first: mine(reply.check_first),
           substitutions: (reply.substitutions || []).filter((s) => names.has(String(s.missing).toLowerCase())) };
}

// "🛒 To buy: cream · check pantry: pasta" under a card, or that it needs nothing.
function buyLine(meal, reply) {
  const own = replyForMeal(reply, meal);
  const parts = [];
  if (own.shopping_list.length) parts.push(`🛒 To buy: ${own.shopping_list.join(", ")}`);
  if (own.check_first.length) parts.push(`check pantry: ${own.check_first.join(", ")}`);
  return el("div", { class: "buyline" },
    parts.length ? parts.join(" · ") : el("span", { class: "none" }, "✓ Nothing to buy"));
}

function renderCard(meal, data, perCard = false) {
  const inv = itemsByName();
  const uses = meal.uses_from_inventory || [];
  const soon = uses.map((n) => inv.get(n)).filter((i) => i && i.use_soon).map((i) => i.display_name);
  const shown = uses.slice(0, 4).map((name) => {
    const item = inv.get(name);
    return el("span", { class: "chip" + (item && item.use_soon ? " soon" : "") }, item ? item.display_name : name);
  });
  if (uses.length > 4) shown.push(el("span", { class: "chip" }, `+${uses.length - 4}`));
  const meta = [`⏱ ${meal.time_minutes} min`];
  if (uses.length) meta.push(`uses ${uses.length} thing${uses.length === 1 ? "" : "s"} you have`);
  return el("button", { class: "card", type: "button", onclick: () => openRecipe(meal, data) },
    el("div", { class: `tile ${tileColor(meal.name)}`, "aria-hidden": "true" }, dishEmoji(meal.name)),
    el("div", {},
      el("div", { class: "title" }, meal.name),
      el("div", { class: "meta" }, meta.join(" · ")),
      perCard ? buyLine(meal, data.reply) : null,
      soon.length ? el("div", { class: "soonline" }, `⏰ uses your ${soon.join(", ")}: needs using`) : null,
      shown.length ? el("div", { class: "chips" }, shown) : null,
      el("div", { class: "open" }, "Open recipe ›")));
}

// The amount the reply's recipe(s) need of an ingredient ("500 g"), or "" (names are canonical).
function amountFor(name, meals) {
  const low = String(name).toLowerCase();
  const amounts = (meals || []).flatMap((m) => m.ingredients.filter((i) => i.name.toLowerCase() === low))
    .map((i) => i.amount).filter(Boolean);
  return [...new Set(amounts)].join(" + ");
}

function shopLine(text, amount) {
  return el("li", {}, text, amount ? el("span", { class: "amount" }, ` · ${amount}`) : null);
}

function renderShop(reply) {
  const box = el("div", { class: "shop" });
  const subs = reply.substitutions || [];
  const buy = reply.shopping_list || [];
  const check = reply.check_first || [];
  const meals = reply.meals || [];
  if (subs.length) {
    box.append(el("h3", {}, "Use instead"), el("ul", {}, subs.map((s) =>
      shopLine(`${displayName(s.use_instead)} instead of ${s.missing}`, amountFor(s.missing, meals)))));
  }
  if (buy.length) box.append(el("h3", {}, "To buy"), el("ul", {}, buy.map((x) => shopLine(x, amountFor(x, meals)))));
  if (check.length) {
    box.append(el("h3", {}, "Check your pantry first"),
      el("ul", { class: "check" }, check.map((x) => shopLine(x, amountFor(x, meals)))));
  }
  if (!buy.length && !check.length) box.append(el("div", { class: "empty" }, "✓ Nothing to buy: you have everything."));
  return box;
}

// Collapsed: one sentence from the steps' plain labels ("3 steps · updated the inventory (removed egg) →
// 5 ideas, 1 failed check (no cream) → checked by code"), failed steps in the warning colour.
// Expanded: one line per step, its label and seconds, with the technical detail under it.
// Replies saved before T4.4 have no labels: the tool name stands in.
function renderTrace(trace, usage) {
  const steps = `${trace.length} step${trace.length === 1 ? "" : "s"}`;
  const parts = trace.flatMap((t, i) => [
    i ? " → " : "", el("span", { class: t.failed ? "fail" : "" }, t.label || t.tool)]);
  return el("details", { class: "trace" },
    el("summary", {}, `${steps}${usage ? ` · ${usage.latency_s.toFixed(1)} s` : ""} · `, ...parts),
    el("ol", {}, trace.map((t) => el("li", { class: t.failed ? "fail" : "" },
      el("span", { class: "step" }, (t.label || t.tool) + (t.seconds != null ? ` · ${t.seconds.toFixed(1)} s` : "")),
      el("span", { class: "tech" }, `${t.tool}(${t.args_summary}) → ${t.result_summary}`)))));
}

// --- recipe sheet --------------------------------------------------------------------------------

// What an ingredient's line says: in the kitchen (staples too), the substitute to use, to buy, or check
// the pantry. Names are canonical on both sides (the server normalizes them).
function ingredientStatus(ing, reply) {
  const low = (x) => String(x).toLowerCase();
  const sub = (reply.substitutions || []).find((s) => low(s.missing) === low(ing.name));
  if (itemsByName().has(ing.name)) return el("span", { class: "have" }, "✓ you have it");
  if (sub) return el("span", { class: "sub" }, `use your ${displayName(sub.use_instead)} instead`);
  if ((reply.shopping_list || []).some((x) => low(x) === low(ing.name))) return el("span", { class: "buy" }, "to buy");
  if ((reply.check_first || []).some((x) => low(x) === low(ing.name))) {
    return el("span", { class: "opt" }, "check your pantry");
  }
  return el("span", { class: "opt" }, ing.essential ? "not in your kitchen" : "optional, not in your kitchen");
}

async function openRecipe(meal, data) {
  const reply = replyForMeal((data && data.reply) || {}, meal);
  $("sheetTitle").textContent = meal.name;
  const body = $("sheetBody");
  const steps = el("div", {}, el("span", { class: "spinner" }), "Writing the steps…");
  // Mode B: the same shopping block as under the card, at the top of the recipe.
  const modeB = (reply.shopping_list || []).length || (reply.check_first || []).length
    || (reply.substitutions || []).length || isModeB(data || {});
  body.replaceChildren(...[
    el("div", { class: "meta" }, `${meal.time_minutes} min · serves ${meal.servings}`),
    modeB ? renderShop(reply) : null,
    el("h3", {}, "Ingredients"),
    el("ul", {}, meal.ingredients.map((i) => el("li", {},
      `${displayName(i.name)}: ${i.amount}` + (i.essential ? "" : " (optional)") + " · ", ingredientStatus(i, reply)))),
    el("h3", {}, "Steps"),
    steps,
  ].filter(Boolean));
  showOverlay("sheet");
  body.scrollTop = 0;  // after showing: a hidden element keeps its old scroll position
  try {
    // The reply's substitutes go along, so the steps say "cottage cheese", not "ricotta".
    const subs = new URLSearchParams();
    for (const s of reply.substitutions || []) subs.append("sub", `${s.missing}:${s.use_instead}`);
    const query = subs.toString() ? `?${subs}` : "";
    const recipe = meal.steps && meal.steps.length ? meal : await api(`/recipe/${encodeURIComponent(meal.id)}/steps${query}`);
    meal.steps = recipe.steps;
    steps.replaceChildren(el("ol", {}, recipe.steps.map((s) => el("li", {}, s))));
  } catch (err) {
    steps.replaceChildren(el("div", { class: "opt" }, err.message));
  }
}

// --- overlays ------------------------------------------------------------------------------------

function showOverlay(id) {
  $("scrim").hidden = false;
  $(id).hidden = false;
}

function closeOverlays() {
  state.openItem = null;
  $("scrim").hidden = true;
  $("drawer").hidden = true;
  $("sheet").hidden = true;
  $("review").hidden = true;
  $("history").hidden = true;
  state.reviewPlaces = null;
}

// --- review after a photo scan ---------------------------------------------------------------------

// Opens by itself after a turn that recognized photos: the items of the photographed places, the ones
// that need a decision first. Edits go through PATCH /inventory like the panel; the sheet redraws.
function openReview(places) {
  state.reviewPlaces = places;
  renderReview();
  showOverlay("review");
}

function reviewItems() {
  return state.inventory.filter((i) => i.source !== "staple" && state.reviewPlaces.includes(i.location));
}

function renderReview() {
  const items = reviewItems();
  const unsure = items.filter((i) => i.uncertain);
  const unseen = items.filter((i) => !i.uncertain && i.not_seen);
  const found = items.filter((i) => !i.uncertain && !i.not_seen);
  $("reviewTitle").textContent = `Check what I found · ${state.reviewPlaces.map(cap).join(", ")}`;
  const group = (title, why, list) => list.length ? el("div", { class: "review-group" },
    el("h3", {}, `${title} (${list.length})`), why ? el("div", { class: "why" }, why) : null,
    el("ul", { class: "items" }, list.map(renderItem))) : null;
  const top = $("reviewBody").scrollTop;
  $("reviewBody").replaceChildren(...[
    group("Not sure what this is", "✓ if it's right, × if it isn't there, or tap it to rename it.", unsure),
    group("Not seen this time", "They were here before. ✓ still there, × finished.", unseen),
    group("In the list", "", found),
    items.length ? null : el("div", { class: "empty-loc" }, "Nothing recognized in these photos."),
  ].filter(Boolean));
  $("reviewBody").scrollTop = top;
  $("reviewOk").textContent = unsure.length || unseen.length ? "All correct" : "Done";
}

async function confirmReview() {
  const flagged = reviewItems().filter((i) => i.uncertain || i.not_seen);
  if (flagged.length) await editInventory(flagged.map((i) => ({ op: "confirm", name: i.name })));
  closeOverlays();
}

// --- inventory panel -----------------------------------------------------------------------------

function setInventory(data) {
  state.inventory = data.inventory;
  state.scanState = data.scan_state;
  if (state.openItem && !state.inventory.some((i) => i.name === state.openItem)) state.openItem = null;
  redrawLists();
  updateHero();
  renderQuick();
}

function redrawLists() {
  renderInventory();
  if (state.reviewPlaces) renderReview();
}

async function editInventory(changes) {
  try {
    setInventory(await api("/inventory", {
      method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(changes),
    }));
  } catch (err) {
    addEntry({ role: "system", text: err.message });
  }
}

// One compact line per item: emoji, name, ⏰ when it needs using, a colour dot for the quantity. Tapping
// the line shows its actions (one item at a time). Items waiting for a decision (orange: not sure what it
// is; grey: not seen in the last photo) keep ✓ and × on the line itself. Staples: name and × only.
function renderItem(item) {
  const flag = item.uncertain ? " uncertain" : item.not_seen ? " notseen" : "";
  const open = state.openItem === item.name && !item.is_staple;
  const row = el("li", { class: "item" + flag + (open ? " open" : "") });
  const del = el("button", { class: "del", type: "button", title: "Delete", "aria-label": `Delete ${item.display_name}`,
                             onclick: () => editInventory([{ op: "remove", name: item.name }]) }, "×");
  const main = el("button", { class: "main", type: "button", "aria-expanded": open ? "true" : "false",
                              onclick: () => { state.openItem = open ? null : item.name; redrawLists(); } },
    el("span", { class: "emo", "aria-hidden": "true" }, itemEmoji(item)),
    el("span", { class: "name" }, item.display_name),
    item.use_soon ? el("span", { class: "flag soonflag", title: "Use soon" }, "⏰") : null,
    item.is_staple ? null : el("span", { class: `lvl ${item.qty_level}` }, el("i"), item.qty_level));
  if (item.is_staple) {
    row.append(el("div", { class: "line" }, el("span", { class: "main" },
      el("span", { class: "emo", "aria-hidden": "true" }, itemEmoji(item)), el("span", { class: "name" }, item.display_name)),
      del));
    return row;
  }
  row.append(el("div", { class: "line" }, ...[main,
    flag ? el("button", { class: "ok", type: "button", title: item.uncertain ? "Yes, this is right" : "Still there",
                          "aria-label": `Confirm ${item.display_name}`,
                          onclick: () => editInventory([{ op: "confirm", name: item.name }]) }, "✓") : null,
    flag ? del : null,
  ].filter(Boolean)));
  if (open) {
    row.append(el("div", { class: "actions" },
      el("span", { class: "seg", role: "group", "aria-label": "Quantity" }, QTY_LEVELS.map((q) =>
        el("button", { class: q === item.qty_level ? "on" : "", type: "button",
                       onclick: () => editInventory([{ op: "set_qty", name: item.name, qty_level: q }]) }, q))),
      el("button", { class: "act" + (item.use_soon ? " on" : ""), type: "button",
                     onclick: () => editInventory([{ op: "set_use_soon", name: item.name, use_soon: !item.use_soon }]) },
        "⏰ Use soon"),
      el("button", { class: "act", type: "button", onclick: () => editName(row, item) }, "✎ Rename"),
      el("button", { class: "act danger", type: "button",
                     onclick: () => editInventory([{ op: "remove", name: item.name }]) }, "Delete")));
  }
  return row;
}

// Inline rename. Saving also confirms an uncertain item, even with the name unchanged.
function editName(row, item) {
  const input = el("input", { type: "text", value: item.display_name, "aria-label": "New name" });
  const save = () => {
    const name = input.value.trim();
    if (!name || (name === item.display_name && !item.uncertain && !item.not_seen)) { redrawLists(); return; }
    editInventory([{ op: "rename", name: item.name, new_name: name }]);
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    if (e.key === "Escape") { e.stopPropagation(); redrawLists(); }
  });
  row.className = "item editing";
  row.replaceChildren(input,
    el("button", { class: "save", type: "button", onclick: save }, "Save"),
    el("button", { class: "cancel", type: "button", onclick: redrawLists }, "Cancel"));
  input.focus();
  input.select();
}

// place: add an item there; null: add a staple (assumed always in the kitchen).
function renderAdd(place) {
  const input = el("input", { type: "text",
    placeholder: place ? `Add to ${place}…` : "Add a staple, e.g. rice…",
    "aria-label": place ? `Add item to ${place}` : "Add a staple" });
  const add = () => {
    const name = input.value.trim();
    if (!name) return;
    editInventory([place ? { op: "add", name, location: place, qty_level: "some" } : { op: "add_staple", name }]);
    input.value = "";
  };
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); add(); } });
  return el("div", { class: "add" }, input, el("button", { type: "button", onclick: add }, "Add"));
}

function renderInventory() {
  const own = state.inventory.filter((i) => i.source !== "staple");
  const staples = state.inventory.filter((i) => i.source === "staple");
  $("invCount").textContent = own.length;

  const body = $("invBody");
  const wasOpen = body.querySelector("details.staples")?.open || false;
  const top = body.scrollTop;
  body.replaceChildren();
  for (const place of PLACES) {
    const here = own.filter((i) => i.location === place)
      // Items waiting for a decision first; otherwise the stored order, so a row does not jump away
      // while its actions are open (⏰ marks use-soon items).
      .sort((a, b) => (b.uncertain - a.uncertain) || (b.not_seen - a.not_seen));
    const when = state.scanState.scanned[place];
    const declined = place === "freezer" && state.scanState.freezer_declined;
    const unsure = here.some((i) => i.uncertain || i.not_seen);
    body.append(el("section", { class: "loc" },
      el("div", { class: "loc-head" },
        el("h2", {}, PLACE_LABEL[place]),
        el("span", { class: "when" + (when ? "" : " no") },
          when ? ago(when) : declined ? "skipped" : "not scanned yet"),
        el("button", { class: "iconbtn", type: "button", title: `Photo of the ${place}`,
                       "aria-label": `Add a photo of the ${place}`, onclick: () => pickPhotos(place) }, "📷")),
      unsure ? el("div", { class: "hint" },
        "Orange: I'm not sure what it is. Grey: not seen in the last photo. ✓ if it's right, × if it's gone, "
        + "or tap the item to rename it.")
             : null,
      here.length ? el("ul", { class: "items" }, here.map(renderItem))
                  : el("div", { class: "empty-loc" }, "Nothing here yet."),
      renderAdd(place)));
  }
  body.append(el("details", { class: "loc staples", open: wasOpen },
    el("summary", {}, `Staples (${staples.length}) — assumed in the kitchen`),
    el("ul", { class: "items" }, staples.map(renderItem)),
    renderAdd(null)));
  body.append(renderRestart(own.length));
  body.scrollTop = top;
}

// Clear the inventory and rebuild it from new photos. Two taps: the link, then the confirm button.
function renderRestart(count) {
  const box = el("div", { class: "restart" });
  const ask = () => box.replaceChildren(el("div", { class: "confirm" },
    el("p", {}, `Clear all ${count} item${count === 1 ? "" : "s"} and the scan dates, then add new photos? `
      + "Your preferences and staples stay."),
    el("div", { class: "row2" },
      el("button", { class: "keep", type: "button", onclick: () => box.replaceChildren(link) }, "Cancel"),
      el("button", { class: "danger", type: "button", onclick: startOver }, "Clear inventory"))));
  const link = el("button", { class: "link", type: "button", onclick: ask }, "Start over: clear the inventory");
  box.append(link);
  return box;
}

async function startOver() {
  if (state.busy) return;
  try {
    setInventory(await api("/inventory/reset", { method: "POST" }));
  } catch (err) {
    addEntry({ role: "system", text: err.message });
    return;
  }
  closeOverlays();
  startSession(newSessionId());  // a fresh chat: the old one talks about items that are gone
  await opening();  // empty inventory: the welcome asks for photos of the fridge and the pantry
}

// --- photos --------------------------------------------------------------------------------------

// source: "file" = the camera (on a phone), "galleryFile" = the photo library.
function pickPhotos(place, source = "file") {
  state.nextPlace = place || null;
  closeOverlays();
  $(source).click();
}

function addPhotos(files) {
  let place = state.nextPlace;
  state.nextPlace = null;
  const room = MAX_PHOTOS - state.pending.length;
  const chosen = [...files].filter((f) => f.type.startsWith("image/"));
  for (const file of chosen.slice(0, room)) {
    // Default: the first photo is Fridge, each next one copies the previous tag.
    const last = state.pending[state.pending.length - 1];
    place = place || (last ? last.place : "fridge");
    state.pending.push({ file, url: URL.createObjectURL(file), place });
    place = null;
  }
  if (chosen.length > room) addEntry({ role: "system", text: `Up to ${MAX_PHOTOS} photos per message.` });
  renderPending();
}

function renderPending() {
  const box = $("pending");
  box.hidden = !state.pending.length;
  box.replaceChildren(...state.pending.map((p, i) => el("div", { class: "thumb" },
    el("img", { src: p.url, alt: `Photo ${i + 1}` }),
    el("button", { class: "tag", type: "button", title: "Tap to change the place",
                   onclick: () => { p.place = PLACES[(PLACES.indexOf(p.place) + 1) % PLACES.length]; renderPending(); } },
      cap(p.place)),
    el("button", { class: "rm", type: "button", "aria-label": "Remove photo",
                   onclick: () => { state.pending.splice(i, 1); renderPending(); } }, "×"))));
  updateSend();
}

// --- quick replies and the empty-inventory welcome -------------------------------------------------

function ownItems() {
  return state.inventory.filter((i) => i.source !== "staple");
}

function setCookMode(mode) {
  state.cookMode = mode === "shop" ? "shop" : "home";
  storageSet("ftt.cookMode", state.cookMode);
  renderCookMode();
}

// The switch above the quick replies; shown once there is an inventory to cook from.
function renderCookMode() {
  const box = $("cookMode");
  const opt = (mode, label, title) => el("button", {
    type: "button", role: "radio", "aria-checked": String(state.cookMode === mode), title,
    disabled: state.busy, onclick: () => setCookMode(mode) }, label);
  box.replaceChildren(
    opt("home", "🏠 Only what I have", "Ideas use only what is in your kitchen"),
    opt("shop", "🛒 Shopping OK", "Ideas may need up to 3 things from the shop"));
  box.hidden = !ownItems().length;
}

// Shortcuts above the text box, depending on what the app knows. Hidden while typing or with photos waiting.
function renderQuick() {
  renderCookMode();
  const box = $("quick");
  const say = (text) => () => { $("input").value = text; updateSend(); $("composer").requestSubmit(); };
  const chips = [];
  if (!ownItems().length) {
    chips.push(["📷 Scan my fridge", () => pickPhotos("fridge")], ["🥫 Scan my pantry", () => pickPhotos("pantry")]);
  } else {
    chips.push(["What can I cook tonight?", say("What can I cook tonight?")],
      ["Something quick", say("Something quick for dinner, under 30 minutes.")],
      ["I want to make…", () => { const i = $("input"); i.value = "I want to make "; updateSend(); i.focus(); }]);
    if (!state.scanState.scanned.pantry) chips.push(["🥫 Scan my pantry", () => pickPhotos("pantry")]);
    else chips.push(["📷 Scan my fridge", () => pickPhotos("fridge")]);
  }
  box.replaceChildren(...chips.map(([label, act]) =>
    el("button", { class: "qchip", type: "button", onclick: act, disabled: state.busy }, label)));
  box.hidden = Boolean($("input").value.trim() || state.pending.length);
}

// A welcome card at the top of the chat while the inventory is empty.
function updateHero() {
  const old = document.getElementById("hero");
  if (ownItems().length) { if (old) old.remove(); return; }
  if (old) return;
  $("messages").prepend(el("section", { class: "hero", id: "hero" },
    el("div", { class: "big", "aria-hidden": "true" }, "🧊"),
    el("h2", {}, "Let's see what's in your kitchen"),
    el("p", {}, "Take a photo of your fridge, then one of your pantry. I'll list what you have and tell you what you can cook."),
    el("button", { class: "go", type: "button", onclick: () => pickPhotos("fridge") }, "📷 Take a photo of your fridge"),
    el("button", { class: "alt", type: "button", onclick: () => pickPhotos("fridge", "galleryFile") },
      "🖼️ or choose photos from your gallery")));
}

// --- sending -------------------------------------------------------------------------------------

function updateSend() {
  $("send").disabled = state.busy || (!$("input").value.trim() && !state.pending.length);
  renderQuick();
}

function setBusy(busy) {
  state.busy = busy;
  $("attach").disabled = busy;
  $("gallery").disabled = busy;
  updateSend();
}

async function send(event) {
  event.preventDefault();
  if (state.busy) return;
  const text = $("input").value.trim();
  const photos = state.pending;
  if (!text && !photos.length) return;

  const form = new FormData();
  form.append("session_id", state.sessionId);
  form.append("message", text);
  form.append("cook_mode", state.cookMode);
  for (const p of photos) { form.append("images", p.file); form.append("locations", p.place); }

  // Object URLs do not survive a reload; the transcript keeps the tags only.
  renderEntry({ role: "user", text, photos: photos.map((p) => ({ url: p.url, place: p.place })) });
  state.transcript.push({ role: "user", text, photos: photos.map((p) => ({ place: p.place })) });
  saveTranscript();
  $("input").value = "";
  autosize();
  state.pending = [];
  renderPending();

  const typing = showTyping(photos.length ? "Looking at your photos" : "Thinking");
  setBusy(true);
  try {
    const data = await api("/chat", { method: "POST", body: form });
    setInventory(data);
    typing.remove();
    addEntry({ role: "agent", data, asked: text });
    const scanned = (data.trace || []).some((s) => s.tool === "recognize_inventory" && !s.failed);
    if (scanned && photos.length) openReview([...new Set(photos.map((p) => p.place))]);
  } catch (err) {
    typing.remove();
    addEntry({ role: "system", text: err.message });
  } finally {
    setBusy(false);
    $("input").focus();
  }
}

function showTyping(text) {
  const typing = agentShell(el("div", { class: "bubble" }, text,
    el("span", { class: "dots", "aria-hidden": "true" }, el("i"), el("i"), el("i"))));
  typing.classList.add("typing");
  $("messages").append(typing);
  scrollDown();
  return typing;
}

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 120) + "px";
}

// The proactive greeting: the agent may take a few seconds (one meal idea), so it shows the typing
// bubble and blocks sending, like a turn.
async function opening() {
  const typing = showTyping("Thinking");
  setBusy(true);
  try {
    const data = await api(`/opening?session_id=${encodeURIComponent(state.sessionId)}`);
    setInventory(data);
    typing.remove();
    // With an empty inventory the welcome card already says it; the fixed welcome message would repeat it.
    if (ownItems().length || data.usage) addEntry({ role: "agent", data });
  } catch (err) {
    typing.remove();
    addEntry({ role: "system", text: err.message });
  } finally {
    setBusy(false);
  }
}

async function refreshInventory() {
  try { setInventory(await api("/inventory")); } catch (err) { addEntry({ role: "system", text: err.message }); }
}

// --- wiring --------------------------------------------------------------------------------------

$("composer").addEventListener("submit", send);
$("input").addEventListener("input", () => { autosize(); updateSend(); });
$("input").addEventListener("keydown", (e) => {
  // Enter sends on a computer; on a phone the keyboard's Enter adds a line (use the Send button).
  if (e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer: coarse)").matches) {
    e.preventDefault();
    $("composer").requestSubmit();
  }
});
$("attach").addEventListener("click", () => pickPhotos(null));
$("gallery").addEventListener("click", () => pickPhotos(null, "galleryFile"));
for (const id of ["file", "galleryFile"]) {
  $(id).addEventListener("change", (e) => { addPhotos(e.target.files); e.target.value = ""; });
}
$("openInv").addEventListener("click", () => showOverlay("drawer"));
$("closeInv").addEventListener("click", closeOverlays);
$("closeSheet").addEventListener("click", closeOverlays);
$("reviewLater").addEventListener("click", closeOverlays);
$("reviewOk").addEventListener("click", confirmReview);
$("scrim").addEventListener("click", closeOverlays);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeOverlays(); });
$("openHistory").addEventListener("click", openHistory);
$("closeHistory").addEventListener("click", closeOverlays);
$("newChat").addEventListener("click", () => {
  if (state.busy) return;
  startSession(newSessionId());
  opening();
});

state.cookMode = storageGet("ftt.cookMode") === "shop" ? "shop" : "home";

(async function init() {
  // The inventory first, so the saved transcript's meal cards show display names and "use soon".
  await refreshInventory();
  startSession(storageGet("ftt.session") || newSessionId());
  if (!state.transcript.length) await opening();
  updateSend();
})();
</script>
</body>
</html>
